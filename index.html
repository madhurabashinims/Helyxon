<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Welcome to To-Do list app</h1>
    <p>Explore your tasks here</p>
  </header>

  <div class="input-row">
    <input type="text" id="task" name="task" placeholder="Enter your task" />
    <button type="button" id="add-task-btn">Add task!</button>
  </div>

  <main>
    <div class="list-wrap">
      <ul id="list"></ul>
    </div>

    <!-- Contact Section -->
    <section id="contact">
      <h2>Contact</h2>
      <ul>
        <li>Email: <a href="mailto:youremail@example.com">madhura9904@gmail.com</a></li>
        <li>Phone: +91 63691 90721</li>
      </ul>
    </section>
  </main>

  <!-- Script at end, plus JS uses DOMContentLoaded so it's safe either way -->
  <script src="script.js"></script>
</body>
</html>
